      function msg(to, from) {
        const edge = orth[from + "_" + to];
        const choice = edge[0];
        if (choice == 0) {
          return `Head ${edge[2]} towards ${edge[1]}`;
        } else if (choice == 1) {
          return `Head ${edge[1]}.`;
        } else if (choice == 2) {
          return "Placeholder direction";
        } else if (choice == 3) {
          return edge[1];
        }
      }

      function getDir() {
        const dirs = document.querySelector("#dirs");
        dirs.innerHTML = "";

        let start = document.querySelector("#The_closest_room_to_you").value;
        let end = document.querySelector("#The_room_you_want_to_go_to").value;
        let targets = keys[end];
        let nodes = keys[start];

        let distance = {};
        let predecessor = {};
        let q = new Set();
        for (const [key, value] of Object.entries(cons)) {
          distance[key] = Infinity;
          predecessor[key] = undefined;
          q.add(key);
        } //set up data

        distance[nodes[0].toString()] = nodes[2];
        distance[nodes[1].toString()] = nodes[3];
        // set starting distance of all starting nodes to 0

        while (q.size > 0) {
          let currentNode = "abc";
          for (let node of q) {
            if (
              currentNode == "abc" ||
              distance[node] < distance[currentNode]
            ) {
              currentNode = node;
            }
          }

          if (!isFinite(distance[currentNode])) {
            break;
          }

          q.delete(currentNode);

          for (const [key, value] of Object.entries(cons[currentNode])) {
            if (q.has(key)) {
              d = distance[currentNode] + value;

              if (d < distance[key]) {
                distance[key] = d;
                predecessor[key] = currentNode;
              }
            }
          }
        }

        console.log(predecessor);

        let endpt = targets[0];
        let dircount = 0;
        while (predecessor[endpt] != undefined) {
          if (dircount == 0) {
            dirs.insertAdjacentHTML(
              "afterbegin",
              `<h4>${msg(
                endpt,
                predecessor[endpt]
              )} until you reach your destination.</h4>`
            );
          } else {
            dirs.insertAdjacentHTML(
              "afterbegin",
              `<h4>${msg(
                endpt,
                predecessor[endpt]
              )} until you reach an intersection.</h4>`
            );
          }
          endpt = predecessor[endpt];
          dircount += 1;
        }
        if (endpt == nodes[0]) {
          dirs.insertAdjacentHTML(
            "afterbegin",
            `<h4>${msg(endpt, nodes[1])}</h4>`
          );
        } else {
          dirs.insertAdjacentHTML(
            "afterbegin",
            `<h4>${msg(endpt, nodes[0])}</h4>`
          );
        }
